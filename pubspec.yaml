name: event_reminder
description: "Planly: calendar, events and reminders with Google Calendar sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^17.5.0
  drift: ">=2.30.0 <2.35.0"
  drift_flutter: ^0.3.1
  intl: ^0.20.3

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_foreground: assets/icon/app_icon_android_foreground.png
  adaptive_icon_background: "#1E6BFA"
  # The foreground PNG is already padded to the adaptive safe zone.
  adaptive_icon_foreground_inset: 0
